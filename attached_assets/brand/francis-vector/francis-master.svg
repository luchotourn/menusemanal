<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 224" role="img" aria-labelledby="francis-title francis-description">
  <title id="francis-title">Francis — master vector</title>
  <desc id="francis-description">Busto del asistente Francis con boina azul, bigote y pañuelo rojo.</desc>
  <style>
    :root {
      --francis-blue: #1f4fa3;
      --francis-ink: #12366c;
      --francis-red: #e33a2c;
      --francis-cream: #f7f0e4;
    }
    .outline { stroke: var(--francis-ink); stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g id="francis-bust">
    <g id="shirt">
      <path d="M18 219c3-14 18-24 43-29 13-2 24-3 34-3h27c27 0 52 8 69 25l2 7Z" fill="var(--francis-cream)"/>
      <path d="M19 209c7-7 15-11 25-14m124 2c9 3 17 8 23 15" fill="none" class="outline" stroke-width="4"/>
    </g>
    <g id="neckerchief">
      <path d="M76 177c-13 1-23 7-30 18 7 11 24 19 51 23l11-14c-14-6-25-15-32-27Z" fill="var(--francis-red)" class="outline" stroke-width="4"/>
      <path d="M126 178c12 2 21 9 26 20-4 9-12 16-25 21l-13-15c7-7 11-16 12-26Z" fill="var(--francis-red)" class="outline" stroke-width="4"/>
      <path d="M99 205c4-5 12-6 18-2 6 4 7 12 3 18l-2 3h-22l-1-4c-2-6-1-11 4-15Z" fill="var(--francis-red)" class="outline" stroke-width="4"/>
      <path d="m101 220-9 4h14m11-4 10 4h-15" fill="var(--francis-red)" class="outline" stroke-width="4"/>
    </g>
    <g id="head-and-neck">
      <path d="M82 94c17-5 38-7 66-6 6 15 8 34 8 54 7 9 8 20 4 30-5 13-18 20-37 19l1 11c-5 8-14 11-25 8-9-3-17-8-24-16v-24c-13 2-23-2-28-11-6-10-4-23 2-31 4-5 9-8 15-7l1-12c4-6 10-11 17-15Z" fill="var(--francis-cream)" class="outline" stroke-width="4"/>
      <path d="M72 130c-7-5-14-3-17 4-4 8-1 18 5 23 4 3 10 4 14 1" fill="none" class="outline" stroke-width="4"/>
    </g>
    <g id="hair">
      <path d="M64 105c4 5 3 11 0 17 6-3 12 1 13 7 3-2 7 0 8 4 1 6-3 13-8 15-5 0-8-6-10-10-4 4-9 0-10-6-2-9 2-19 7-27Z" fill="var(--francis-ink)"/>
    </g>
    <g id="face-marks" fill="none" class="outline">
      <path id="left-brow" d="M91 106c6-6 13-8 20-5" stroke-width="6"/>
      <path id="right-brow" d="M136 99c6-3 12-2 17 2" stroke-width="6"/>
      <path id="left-eye" d="M96 120c2 7 9 9 14 2" stroke-width="4"/>
      <path id="right-eye" d="M137 115c2 7 9 9 14 2" stroke-width="4"/>
      <path id="nose" d="M129 111c-1 12 3 20 11 25 5 3 5 8 0 11" stroke-width="4"/>
      <path id="smile" d="M103 170c12 7 26 8 39 3" stroke-width="4"/>
    </g>
    <path id="moustache" d="M99 137c8 9 18 10 27 2 4-3 7-7 9-11 4 7 11 11 20 10 5 0 9-2 13-6 1 9-3 16-11 21-9 5-19 4-27-3-7 9-17 13-27 10-8-2-14-7-16-14-1-5 0-10 2-14 3 2 6 4 10 5Z" fill="var(--francis-ink)"/>
    <g id="beret">
      <path d="M70 36c-3-7-2-12 2-13 5 1 6 6 7 13" fill="var(--francis-blue)" class="outline" stroke-width="4"/>
      <path d="M38 111c-11-8-12-21-5-34 8-15 24-27 42-35 22-10 50-14 76-12 24 1 36 8 38 20 3 16-9 29-29 37-13 5-25 5-37 5-18 0-36 5-53 14-14 8-25 11-32 5Z" fill="var(--francis-blue)" class="outline" stroke-width="4"/>
    </g>
  </g>
